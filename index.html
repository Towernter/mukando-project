<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mukando Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <p class="eyebrow">Mukando tracker</p>
    <h1 id="group-name">Our Mukando</h1>
    <p class="now" id="now"></p>

    <section class="stats">
      <div class="stat"><span class="num" id="stat-members"></span><span class="label">Members</span></div>
      <div class="stat"><span class="num" id="stat-contribution"></span><span class="label">Each pays monthly</span></div>
      <div class="stat"><span class="num" id="stat-pot"></span><span class="label">Pot each month</span></div>
      <div class="stat"><span class="num" id="stat-cycle"></span><span class="label">Full cycle</span></div>
    </section>

    <h2>Payout schedule</h2>
    <ul class="schedule" id="schedule"></ul>

    <p class="footer">Everyone pays in each month. One member takes the whole pot, in turn.</p>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
